name: Sync trade journal
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib
      - run: python sync_journal.py
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Commit charts
        run: |
          git config user.name "trade-journal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add charts
          git diff --cached --quiet || (git commit -m "Update charts" && git push)
